name: Deploy notebook to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --init --ipc=host
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Build site and search index
        run: npm run build
      - name: Test generated site
        run: npm test
      - name: Test reader interactions
        run: npm run test:browser
      - name: Configure Pages
        if: &main_branch github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload site
        if: *main_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: *main_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
